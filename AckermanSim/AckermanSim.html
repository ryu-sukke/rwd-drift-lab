<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AckermanSim | フロントスライドラック</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light;
        --ink: #16282b;
        --edge: #cfdad7;
        --paper: #f8faf7;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        color: var(--ink);
        background: var(--paper);
        font:
          14px "Yu Gothic UI",
          sans-serif;
      }
      main {
        position: relative;
        height: 30dvh;
        background: #edf2ef;
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      #scene:active {
        cursor: grabbing;
      }
      #status,
      #poseWarning {
        position: absolute;
        inset: 10px auto auto 16px;
        margin: 0;
        color: #425856;
        pointer-events: none;
      }
      .body-width {
        position: absolute;
        inset: auto 16px 20px auto;
        max-width: calc(50% - 16px);
        margin: 0;
        font-weight: 600;
        text-align: end;
        pointer-events: none;
      }
      .toe-history {
        position: absolute;
        z-index: 2;
        inset: 10px 12px auto auto;
        width: min(312.5px, 52.5vw);
        padding: 6px 8px;
        border: 1px solid var(--edge);
        border-radius: 4px;
        background: rgb(248 250 247 / 94%);
      }
      .toe-history-title {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
      }
      #toeHistoryCanvas {
        display: block;
        width: 100%;
        height: 115px;
      }
      .toe-history button {
        display: block;
        min-height: 28px;
        margin-inline-start: auto;
        padding: 2px 8px;
      }
      .drawing-toggles {
        position: absolute;
        inset: auto auto 20px 16px;
        display: flex;
        gap: 12px;
      }
      .drawing-toggles label {
        align-items: center;
        cursor: pointer;
      }
      .drawing-toggles input {
        margin: 0;
      }
      .drawing-resize {
        position: absolute;
        inset: auto 0 0;
        height: 16px;
        display: grid;
        place-items: center;
        cursor: ns-resize;
        touch-action: none;
      }
      .drawing-resize::before {
        content: "";
        width: 36px;
        height: 3px;
        border-radius: 2px;
        background: #647572;
      }
      .drawing-resize:focus-visible {
        outline: 2px solid #147d85;
        outline-offset: -2px;
      }
      footer {
        display: grid;
        padding: 12px clamp(16px, 4%, 48px);
        border-block-start: 1px solid var(--edge);
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px clamp(8px, 2vw, 24px);
      }
      .adjustments {
        padding: 12px clamp(16px, 4%, 48px);
        border-block-start: 1px solid var(--edge);
      }
      .steering-control {
        grid-column: 1 / -1;
      }
      .adjustments summary {
        padding-block: 4px;
        cursor: pointer;
        font-weight: 600;
      }
      .adjustments details {
        margin-block-end: 8px;
      }
      .adjustment-control {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px clamp(12px, 3vw, 24px);
      }
      .adjustment-control output {
        white-space: nowrap;
      }
      .adjustment-control.linked-adjustment {
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        column-gap: clamp(6px, 2vw, 16px);
      }
      .linked-adjustment > div {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .linked-adjustment label {
        flex-wrap: wrap;
      }
      label {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        font-weight: 600;
      }
      output {
        font-variant-numeric: tabular-nums;
      }
      .angles {
        display: grid;
        gap: 4px;
        margin-top: 4px;
      }
      .angles span {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        white-space: nowrap;
      }
      .angles output {
        text-align: end;
      }
      input[type="range"] {
        width: 100%;
        margin: 5px 0 0;
      }
      input {
        accent-color: #147d85;
      }
      .stroke-sync {
        display: grid;
        place-items: center;
        width: 36px;
        padding: 0;
        align-self: start;
      }
      .stroke-sync[aria-pressed="true"] .link-off,
      .stroke-sync[aria-pressed="false"] .link-on {
        display: none;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button {
        font: inherit;
        color: inherit;
        background: #fff;
        border: 1px solid var(--edge);
        border-radius: 5px;
        min-height: 36px;
        padding: 4px 10px;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #deeeea;
        border-color: #147d85;
      }
      @media (max-width: 760px) {
        footer {
          grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        }
        .buttons {
          grid-column: 1 / -1;
        }
        .toe-history {
          inset: 8px 8px auto auto;
          width: min(262.5px, 60vw);
          padding: 5px 6px;
        }
        #toeHistoryCanvas {
          height: 102.5px;
        }
      }
      @media (max-width: 520px) {
        .body-width {
          inset-block-end: 48px;
        }
      }
    </style>
  </head>
  <body>
    <main id="drawingArea">
      <canvas
        id="scene"
        aria-label="左右のリアアーム、トーリンク、ナックルの3D機構図"
      ></canvas>
      <section
        id="toeHistoryPanel"
        class="toe-history"
        aria-label="操舵とトー差分のグラフ"
        hidden
      >
        <p class="toe-history-title">操舵 (mm) × トー差分 (°)</p>
        <canvas
          id="toeHistoryCanvas"
          aria-label="横軸は操舵量 mm、縦軸は左右トー角の合計 度"
        ></canvas>
        <button id="clearToeHistory" type="button">クリア</button>
      </section>
      <p id="status" role="status">3D描画を準備中</p>
      <p id="poseWarning" role="status" hidden>
        この設定ではトーロッドが取付点に届きません
      </p>
      <div class="body-width" id="bodyWidthDisplay" hidden>
        <div>ナックル間 <output id="bodyWidth">--</output></div>
        <div>ロールセンター高 <output id="rollCenterHeight">--</output></div>
      </div>
      <div class="drawing-toggles">
        <label>
          <input id="showRollCenter" type="checkbox" autocomplete="off" />
          ロールセンター
        </label>
        <label>
          <input
            id="showAckermann"
            type="checkbox"
            autocomplete="off"
            aria-controls="toeHistoryPanel"
          />
          アッカーマン（簡易）
        </label>
      </div>
      <div
        id="drawingResize"
        class="drawing-resize"
        role="separator"
        tabindex="0"
        aria-label="描画領域の高さ"
        aria-controls="drawingArea"
        aria-orientation="horizontal"
        aria-valuemin="20"
        aria-valuemax="70"
        aria-valuenow="30"
        aria-valuetext="30%"
      ></div>
    </main>
    <footer>
      <div>
        <label for="left">左車高 <output id="leftValue">10.0 mm</output></label
        ><input
          id="left"
          type="range"
          min="-12"
          max="12"
          step="0.5"
          value="0"
          aria-valuetext="10.0 mm"
        />
        <div class="angles" role="group" aria-label="左ナックルの角度">
          <span
            >キャンバー
            <output
              id="leftCamber"
              for="left"
              aria-label="左キャンバー"
              aria-live="off"
              >--</output
            ></span
          >
          <span
            >アングル
            <output
              id="leftToe"
              for="left"
              aria-label="左アングル（正はトーアウト）"
              aria-live="off"
              >--</output
            ></span
          >
          <span
            >キャスター
            <output
              id="leftCaster"
              for="left"
              aria-label="左キャスター（正は上側が後方）"
              aria-live="off"
              >--</output
            ></span
          >
        </div>
      </div>
      <button
        id="strokeSync"
        class="stroke-sync"
        type="button"
        aria-pressed="true"
        aria-label="左右の車高を連結"
        title="左右の車高を連結"
      >
        <svg
          class="link-on"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 17H7A5 5 0 0 1 7 7h2m6 0h2a5 5 0 1 1 0 10h-2m-7-5h8" />
        </svg>
        <svg
          class="link-off"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 17H7A5 5 0 0 1 7 7h2m6 0h2a5 5 0 1 1 0 10h-2" />
          <path d="m3 3 18 18" />
        </svg>
      </button>
      <div>
        <label for="right"
          >右車高 <output id="rightValue">10.0 mm</output></label
        ><input
          id="right"
          type="range"
          min="-12"
          max="12"
          step="0.5"
          value="0"
          aria-valuetext="10.0 mm"
        />
        <div class="angles" role="group" aria-label="右ナックルの角度">
          <span
            >キャンバー
            <output
              id="rightCamber"
              for="right"
              aria-label="右キャンバー"
              aria-live="off"
              >--</output
            ></span
          >
          <span
            >アングル
            <output
              id="rightToe"
              for="right"
              aria-label="右アングル（正はトーアウト）"
              aria-live="off"
              >--</output
            ></span
          >
          <span
            >キャスター
            <output
              id="rightCaster"
              for="right"
              aria-label="右キャスター（正は上側が後方）"
              aria-live="off"
              >--</output
            ></span
          >
        </div>
      </div>
      <div class="buttons" role="group" aria-label="視点と動作">
        <button data-view="oblique" aria-pressed="true">斜め</button
        ><button data-view="top" aria-pressed="false">上面</button
        ><button data-view="rear" aria-pressed="false">後面</button
        ><button id="animate" aria-pressed="false">自動バンプ</button
        ><button id="autoSteering" aria-pressed="false">自動操舵</button>
      </div>
      <div class="steering-control">
        <label for="rackTravel">
          操舵 <output id="rackTravelValue" for="rackTravel">0.0 mm</output>
        </label>
        <input
          id="rackTravel"
          type="range"
          min="-17"
          max="17"
          step="0.1"
          value="0"
        />
      </div>
    </footer>
    <section class="adjustments" aria-label="調整">
      <details>
        <summary>タイロッド</summary>
        <div class="adjustment-control">
          <div>
            <label for="leftToeHeight">
              左起点高さ
              <output id="leftToeHeightValue" for="leftToeHeight">0 mm</output>
            </label>
            <input
              id="leftToeHeight"
              type="range"
              min="-5"
              max="5"
              step="0.1"
              value="0"
              autocomplete="off"
            />
          </div>
          <div>
            <label for="rightToeHeight">
              右起点高さ
              <output id="rightToeHeightValue" for="rightToeHeight"
                >0 mm</output
              >
            </label>
            <input
              id="rightToeHeight"
              type="range"
              min="-5"
              max="5"
              step="0.1"
              value="0"
              autocomplete="off"
            />
          </div>
        </div>
        <div class="adjustment-control">
          <div>
            <label for="leftToeProjection">
              左起点突き出し
              <output id="leftToeProjectionValue" for="leftToeProjection"
                >3.0 mm</output
              >
            </label>
            <input
              id="leftToeProjection"
              type="range"
              min="-2"
              max="8"
              step="0.1"
              value="3"
            />
          </div>
          <div>
            <label for="rightToeProjection">
              右起点突き出し
              <output id="rightToeProjectionValue" for="rightToeProjection"
                >3.0 mm</output
              >
            </label>
            <input
              id="rightToeProjection"
              type="range"
              min="-2"
              max="8"
              step="0.1"
              value="3"
            />
          </div>
        </div>
        <div class="adjustment-control">
          <div>
            <label for="leftToeRodLength">
              左長さ
              <output id="leftToeRodLengthValue" for="leftToeRodLength"
                >39.900 mm</output
              >
            </label>
            <input
              id="leftToeRodLength"
              type="range"
              min="39"
              max="42"
              step="any"
              value="39.9"
            />
          </div>
          <div>
            <label for="rightToeRodLength">
              右長さ
              <output id="rightToeRodLengthValue" for="rightToeRodLength"
                >39.900 mm</output
              >
            </label>
            <input
              id="rightToeRodLength"
              type="range"
              min="39"
              max="42"
              step="any"
              value="39.9"
            />
          </div>
        </div>
      </details>
      <details>
        <summary>サスマウント</summary>
        <div class="adjustment-control">
          <div>
            <label for="frontLowerWidth">
              前幅
              <output id="frontLowerWidthValue" for="frontLowerWidth"
                >47.6 mm</output
              >
            </label>
            <input
              id="frontLowerWidth"
              type="range"
              min="40.4"
              max="55"
              step="0.1"
              value="47.6"
            />
          </div>
          <div>
            <label for="rearLowerWidth">
              後幅
              <output id="rearLowerWidthValue" for="rearLowerWidth"
                >48.0 mm</output
              >
            </label>
            <input
              id="rearLowerWidth"
              type="range"
              min="40.4"
              max="55"
              step="0.1"
              value="48"
            />
          </div>
        </div>
        <div class="adjustment-control">
          <div>
            <label for="leftFrontLowerHeight">
              左前高さ
              <output id="leftFrontLowerHeightValue" for="leftFrontLowerHeight"
                >0.0 mm</output
              >
            </label>
            <input
              id="leftFrontLowerHeight"
              type="range"
              min="-5"
              max="5"
              step="0.1"
              value="0"
            />
          </div>
          <div>
            <label for="rightFrontLowerHeight">
              右前高さ
              <output
                id="rightFrontLowerHeightValue"
                for="rightFrontLowerHeight"
                >0.0 mm</output
              >
            </label>
            <input
              id="rightFrontLowerHeight"
              type="range"
              min="-5"
              max="5"
              step="0.1"
              value="0"
            />
          </div>
        </div>
        <div class="adjustment-control">
          <div>
            <label for="leftRearLowerHeight">
              左後高さ
              <output id="leftRearLowerHeightValue" for="leftRearLowerHeight"
                >0.0 mm</output
              >
            </label>
            <input
              id="leftRearLowerHeight"
              type="range"
              min="-5"
              max="5"
              step="0.1"
              value="0"
            />
          </div>
          <div>
            <label for="rightRearLowerHeight">
              右後高さ
              <output id="rightRearLowerHeightValue" for="rightRearLowerHeight"
                >0.0 mm</output
              >
            </label>
            <input
              id="rightRearLowerHeight"
              type="range"
              min="-5"
              max="5"
              step="0.1"
              value="0"
            />
          </div>
        </div>
      </details>
      <details>
        <summary>アッパーマウント</summary>
        <div class="adjustment-control">
          <div>
            <label for="leftUpperMountWidth">
              左幅
              <output id="leftUpperMountWidthValue" for="leftUpperMountWidth"
                >44.0 mm</output
              >
            </label>
            <input
              id="leftUpperMountWidth"
              type="range"
              min="34"
              max="54"
              step="0.1"
              value="44"
            />
          </div>
          <div>
            <label for="rightUpperMountWidth">
              右幅
              <output id="rightUpperMountWidthValue" for="rightUpperMountWidth"
                >44.0 mm</output
              >
            </label>
            <input
              id="rightUpperMountWidth"
              type="range"
              min="34"
              max="54"
              step="0.1"
              value="44"
            />
          </div>
        </div>
        <div class="adjustment-control">
          <div>
            <label for="leftUpperMountHeight">
              左高さ調整
              <output id="leftUpperMountHeightValue" for="leftUpperMountHeight"
                >0.0 mm</output
              >
            </label>
            <input
              id="leftUpperMountHeight"
              type="range"
              min="-5"
              max="5"
              step="0.1"
              value="0"
            />
          </div>
          <div>
            <label for="rightUpperMountHeight">
              右高さ調整
              <output
                id="rightUpperMountHeightValue"
                for="rightUpperMountHeight"
                >0.0 mm</output
              >
            </label>
            <input
              id="rightUpperMountHeight"
              type="range"
              min="-5"
              max="5"
              step="0.1"
              value="0"
            />
          </div>
        </div>
      </details>
      <details>
        <summary>アーム</summary>
        <div class="adjustment-control">
          <div>
            <label for="leftUpperArmLength">
              左アッパー長さ
              <output id="leftUpperArmLengthValue" for="leftUpperArmLength"
                >52.0 mm</output
              >
            </label>
            <input
              id="leftUpperArmLength"
              type="range"
              min="50"
              max="55"
              step="0.1"
              value="52"
            />
          </div>
          <div>
            <label for="rightUpperArmLength">
              右アッパー長さ
              <output id="rightUpperArmLengthValue" for="rightUpperArmLength"
                >52.0 mm</output
              >
            </label>
            <input
              id="rightUpperArmLength"
              type="range"
              min="50"
              max="55"
              step="0.1"
              value="52"
            />
          </div>
        </div>
        <div class="adjustment-control">
          <div>
            <label for="leftUpperArmDepth">
              左アッパー前後
              <output id="leftUpperArmDepthValue" for="leftUpperArmDepth"
                >1.0 mm</output
              >
            </label>
            <input
              id="leftUpperArmDepth"
              type="range"
              min="-5"
              max="5"
              step="0.1"
              value="1"
            />
          </div>
          <div>
            <label for="rightUpperArmDepth">
              右アッパー前後
              <output id="rightUpperArmDepthValue" for="rightUpperArmDepth"
                >1.0 mm</output
              >
            </label>
            <input
              id="rightUpperArmDepth"
              type="range"
              min="-5"
              max="5"
              step="0.1"
              value="1"
            />
          </div>
        </div>
        <div class="adjustment-control">
          <div>
            <label for="leftLowerArmLength">
              左ロア長さ
              <output id="leftLowerArmLengthValue" for="leftLowerArmLength"
                >55.0 mm</output
              >
            </label>
            <input
              id="leftLowerArmLength"
              type="range"
              min="53"
              max="58"
              step="0.1"
              value="55"
            />
          </div>
          <div>
            <label for="rightLowerArmLength">
              右ロア長さ
              <output id="rightLowerArmLengthValue" for="rightLowerArmLength"
                >55.0 mm</output
              >
            </label>
            <input
              id="rightLowerArmLength"
              type="range"
              min="53"
              max="58"
              step="0.1"
              value="55"
            />
          </div>
        </div>
        <div class="adjustment-control">
          <div>
            <label for="leftLowerArmDepth">
              左ロア前後
              <output id="leftLowerArmDepthValue" for="leftLowerArmDepth"
                >0.0 mm</output
              >
            </label>
            <input
              id="leftLowerArmDepth"
              type="range"
              min="-5"
              max="5"
              step="0.1"
              value="0"
            />
          </div>
          <div>
            <label for="rightLowerArmDepth">
              右ロア前後
              <output id="rightLowerArmDepthValue" for="rightLowerArmDepth"
                >0.0 mm</output
              >
            </label>
            <input
              id="rightLowerArmDepth"
              type="range"
              min="-5"
              max="5"
              step="0.1"
              value="0"
            />
          </div>
        </div>
      </details>
      <details>
        <summary>ナックル</summary>
        <div class="adjustment-control">
          <div>
            <label for="leftKnuckleUpperHeight">
              左アッパー高さ
              <output
                id="leftKnuckleUpperHeightValue"
                for="leftKnuckleUpperHeight"
                >2.0 mm</output
              >
            </label>
            <input
              id="leftKnuckleUpperHeight"
              type="range"
              min="-5"
              max="5"
              step="0.1"
              value="2"
            />
          </div>
          <div>
            <label for="rightKnuckleUpperHeight">
              右アッパー高さ
              <output
                id="rightKnuckleUpperHeightValue"
                for="rightKnuckleUpperHeight"
                >2.0 mm</output
              >
            </label>
            <input
              id="rightKnuckleUpperHeight"
              type="range"
              min="-5"
              max="5"
              step="0.1"
              value="2"
            />
          </div>
        </div>
        <div class="adjustment-control">
          <div>
            <label for="leftKnuckleLowerHeight">
              左ロア高さ
              <output
                id="leftKnuckleLowerHeightValue"
                for="leftKnuckleLowerHeight"
                >0.0 mm</output
              >
            </label>
            <input
