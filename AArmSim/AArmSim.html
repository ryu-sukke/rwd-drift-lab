<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AArmSim | リアAアーム</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light;
        --ink: #16282b;
        --edge: #cfdad7;
        --paper: #f8faf7;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        color: var(--ink);
        background: var(--paper);
        font:
          14px "Yu Gothic UI",
          sans-serif;
      }
      main {
        position: relative;
        height: 30dvh;
        background: #edf2ef;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      #status,
      #poseWarning {
        position: absolute;
        inset: 10px auto auto 16px;
        margin: 0;
        color: #425856;
        pointer-events: none;
      }
      .body-width {
        position: absolute;
        inset: auto 16px 20px auto;
        max-width: calc(50% - 16px);
        margin: 0;
        font-weight: 600;
        text-align: end;
        pointer-events: none;
      }
      .roll-center-toggle {
        position: absolute;
        inset: auto auto 20px 16px;
        align-items: center;
        cursor: pointer;
      }
      .roll-center-toggle input {
        margin: 0;
      }
      .drawing-resize {
        position: absolute;
        inset: auto 0 0;
        height: 16px;
        display: grid;
        place-items: center;
        cursor: ns-resize;
        touch-action: none;
      }
      .drawing-resize::before {
        content: "";
        width: 36px;
        height: 3px;
        border-radius: 2px;
        background: #647572;
      }
      .drawing-resize:focus-visible {
        outline: 2px solid #147d85;
        outline-offset: -2px;
      }
      footer {
        display: grid;
        padding: 12px clamp(16px, 4%, 48px);
        border-block-start: 1px solid var(--edge);
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px clamp(8px, 2vw, 24px);
      }
      .adjustments {
        padding: 12px clamp(16px, 4%, 48px);
        border-block-start: 1px solid var(--edge);
      }
      .adjustments summary {
        padding-block: 4px;
        cursor: pointer;
        font-weight: 600;
      }
      .adjustments details {
        margin-block-end: 8px;
      }
      .adjustment-control {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px clamp(12px, 3vw, 24px);
      }
      .adjustment-control output {
        white-space: nowrap;
      }
      .adjustment-control.linked-adjustment {
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        column-gap: clamp(6px, 2vw, 16px);
      }
      .linked-adjustment > div {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .linked-adjustment label {
        flex-wrap: wrap;
      }
      label {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        font-weight: 600;
      }
      output {
        font-variant-numeric: tabular-nums;
      }
      .angles {
        display: grid;
        gap: 4px;
        margin-top: 4px;
      }
      .angles span {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        white-space: nowrap;
      }
      .angles output {
        text-align: end;
      }
      input[type="range"] {
        width: 100%;
        margin: 5px 0 0;
      }
      input {
        accent-color: #147d85;
      }
      .emphasis {
        align-items: center;
        min-height: 36px;
        padding: 0 6px;
        cursor: pointer;
      }
      .emphasis input {
        margin: 0;
      }
      .stroke-sync {
        display: grid;
        place-items: center;
        width: 36px;
        padding: 0;
        align-self: start;
      }
      .stroke-sync[aria-pressed="true"] .link-off,
      .stroke-sync[aria-pressed="false"] .link-on {
        display: none;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button {
        font: inherit;
        color: inherit;
        background: #fff;
        border: 1px solid var(--edge);
        border-radius: 5px;
        min-height: 36px;
        padding: 4px 10px;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #deeeea;
        border-color: #147d85;
      }
      @media (max-width: 760px) {
        footer {
          grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        }
        .buttons {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <main id="drawingArea">
      <canvas
        id="scene"
        aria-label="左右のリアアーム、トーリンク、ナックルの3D機構図"
      ></canvas>
      <p id="status" role="status">3D描画を準備中</p>
      <p id="poseWarning" role="status" hidden>
        この設定ではトーロッドが取付点に届きません
      </p>
      <div class="body-width" id="bodyWidthDisplay" hidden>
        <div>ナックル間 <output id="bodyWidth">--</output></div>
        <div>ロールセンター高 <output id="rollCenterHeight">--</output></div>
      </div>
      <label class="roll-center-toggle">
        <input id="showRollCenter" type="checkbox" autocomplete="off" />
        ロールセンター
      </label>
      <div
        id="drawingResize"
        class="drawing-resize"
        role="separator"
        tabindex="0"
        aria-label="描画領域の高さ"
        aria-controls="drawingArea"
        aria-orientation="horizontal"
        aria-valuemin="20"
        aria-valuemax="70"
        aria-valuenow="30"
        aria-valuetext="30%"
      ></div>
    </main>
    <footer>
      <div>
        <label for="left">左車高 <output id="leftValue">8.0 mm</output></label
        ><input
          id="left"
          type="range"
          min="-8"
          max="7"
          step="0.5"
          value="0"
          aria-valuetext="8.0 mm"
        />
        <div class="angles" role="group" aria-label="左ナックルの角度">
          <span
            >キャンバー
            <output
              id="leftCamber"
              for="left"
              aria-label="左キャンバー"
              aria-live="off"
              >--</output
            ></span
          >
          <span
            >トー
            <output
              id="leftToe"
              for="left"
              aria-label="左トー（正はトーアウト）"
              aria-live="off"
              >--</output
            ></span
          >
          <span
            >キャスター
            <output
              id="leftCaster"
              for="left"
              aria-label="左キャスター（正は上側が後方）"
              aria-live="off"
              >--</output
            ></span
          >
        </div>
      </div>
      <button
        id="strokeSync"
        class="stroke-sync"
        type="button"
        aria-pressed="true"
        aria-label="左右の車高を連結"
        title="左右の車高を連結"
      >
        <svg
          class="link-on"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 17H7A5 5 0 0 1 7 7h2m6 0h2a5 5 0 1 1 0 10h-2m-7-5h8" />
        </svg>
        <svg
          class="link-off"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 17H7A5 5 0 0 1 7 7h2m6 0h2a5 5 0 1 1 0 10h-2" />
          <path d="m3 3 18 18" />
        </svg>
      </button>
      <div>
        <label for="right">右車高 <output id="rightValue">8.0 mm</output></label
        ><input
          id="right"
          type="range"
          min="-8"
          max="7"
          step="0.5"
          value="0"
          aria-valuetext="8.0 mm"
        />
        <div class="angles" role="group" aria-label="右ナックルの角度">
          <span
            >キャンバー
            <output
              id="rightCamber"
              for="right"
              aria-label="右キャンバー"
              aria-live="off"
              >--</output
            ></span
          >
          <span
            >トー
            <output
              id="rightToe"
              for="right"
              aria-label="右トー（正はトーアウト）"
              aria-live="off"
              >--</output
            ></span
          >
          <span
            >キャスター
            <output
              id="rightCaster"
              for="right"
              aria-label="右キャスター（正は上側が後方）"
              aria-live="off"
              >--</output
            ></span
          >
        </div>
      </div>
      <div class="buttons" role="group" aria-label="視点と動作">
        <button data-view="oblique" aria-pressed="true">斜め</button
        ><button data-view="top" aria-pressed="false">上面</button
        ><button data-view="rear" aria-pressed="false">後面</button
        ><button id="animate" aria-pressed="false">自動バンプ</button>
        <label
          class="emphasis"
          title="ナックルのキャンバー角とトー角を描画上で3倍に強調"
        >
          <input id="emphasize" type="checkbox" autocomplete="off" />
          視覚強調
        </label>
      </div>
    </footer>
    <section class="adjustments" aria-label="調整">
      <details>
        <summary>トーロッド</summary>
        <div class="adjustment-control">
          <div>
            <label for="leftToeHeight">
              左起点高さ
              <output id="leftToeHeightValue" for="leftToeHeight">2 mm</output>
            </label>
            <input

              type="range"

          </div>
          <div>
            <label for="rightToeHeight">

        <div class="adjustment-control">

            <label for="rightFrontLowerHeight">

        <div class="adjustment-control">

          </div>
          <div>
            <label for="rightRearLowerHeight">
              右後高さ

        <div class="adjustment-control">

      <button id="saveSliders" type="button">保存</button>
      <button id="initializeSliders" type="button">初期化</button>
      <span id="sliderSaveStatus" role="status"></span>

    <script src="./three.min.js"></script>
    <script>
      const canvas = document.getElementById("scene");
      const status = document.getElementById("status");
      const drawingArea = document.getElementById("drawingArea");
      const drawingResize = document.getElementById("drawingResize");
      const minDrawingHeight = Number(
        drawingResize.getAttribute("aria-valuemin"),
      );
      const maxDrawingHeight = Number(
        drawingResize.getAttribute("aria-valuemax"),
      );
      let drawingHeight = Number(drawingResize.getAttribute("aria-valuenow"));
      let drawingDrag = null;

      function updateDrawingHeight(value) {
        drawingHeight = Math.min(
          maxDrawingHeight,
          Math.max(minDrawingHeight, Math.round(value)),
        );
        drawingArea.style.height = `${drawingHeight}dvh`;
        drawingResize.setAttribute("aria-valuenow", drawingHeight);
        drawingResize.setAttribute("aria-valuetext", `${drawingHeight}%`);
      }

      drawingResize.addEventListener("pointerdown", (event) => {
        if (!event.isPrimary || event.button !== 0 || drawingDrag) return;
        drawingDrag = {
          pointerId: event.pointerId,
          startY: event.clientY,
          height: drawingHeight,
        };
        drawingResize.setPointerCapture(event.pointerId);
      });
      drawingResize.addEventListener("pointermove", (event) => {
        if (event.pointerId !== drawingDrag?.pointerId) return;
        const delta =
          (100 * (event.clientY - drawingDrag.startY)) / window.innerHeight;
        updateDrawingHeight(drawingDrag.height + delta);
      });
      drawingResize.addEventListener("lostpointercapture", (event) => {
        if (event.pointerId === drawingDrag?.pointerId) drawingDrag = null;
      });
      drawingResize.addEventListener("keydown", (event) => {
        const heights = {
          ArrowUp: drawingHeight - 1,
          ArrowDown: drawingHeight + 1,
          Home: minDrawingHeight,
          End: maxDrawingHeight,
        };
        if (!Object.hasOwn(heights, event.key)) return;
        event.preventDefault();
        updateDrawingHeight(heights[event.key]);
      });

      function start() {
        const { Vector3, MathUtils } = THREE;
        const vector = (x, y, z) => new Vector3(x, y, z);
        const colors = {
          upper: 0x177caa,
          lower: 0xb65319,
          toe: 0x9a355f,
          hub: 0x167657,
          frame: 0x647572,
        };
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xedf2ef);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        const camera = new THREE.OrthographicCamera();
        camera.near = 0.1;
        camera.far = 1000;
        const up = vector(0, 1, 0);
        const rear = vector(0, 0, 1);
        const toeEndBaseLength = 22;
        const toeMountStraightLength = 10;
        const toeMountBendAngle = MathUtils.degToRad(20);
        const knuckleBasis = new THREE.Matrix4();
        const frameCenter = vector(0, -2, -10);
        const lineGeometry = new THREE.CylinderGeometry(1, 1, 1, 10);
        const jointGeometry = new THREE.SphereGeometry(1, 12, 8);
        const barrelProfile = [
          [6.2, -7.5],
          [8, -7.5],
          [9.5, -6],
          [9.5, 6],
          [8, 7.5],
          [6.2, 7.5],
          [6.2, -7.5],
        ];
        const barrelGeometry = new THREE.LatheGeometry(
          barrelProfile.map(
            ([radius, height]) => new THREE.Vector2(radius, height),
          ),
          32,
        );
        const barrelMaterial = new THREE.MeshLambertMaterial({
          color: colors.hub,
        });
        scene.add(new THREE.HemisphereLight(0xffffff, 0x819891, 0.85));
        const keyLight = new THREE.DirectionalLight(0xffffff, 0.65);
        keyLight.position.set(20, 80, 40);
        scene.add(keyLight);
        const materials = Object.fromEntries(
          Object.entries(colors).map(([part, color]) => [
            part,
            new THREE.MeshBasicMaterial({ color }),
          ]),
        );

        function mesh(geometry, part) {
          const object = new THREE.Mesh(geometry, materials[part]);
          scene.add(object);
          return object;
        }

        function segment(object, from, to, radius) {
          const delta = to.clone().sub(from);
          object.position.copy(from).addScaledVector(delta, 0.5);
          object.scale.set(radius, delta.length(), radius);
          object.quaternion.setFromUnitVectors(up, delta.normalize());
        }

        function fixedLine(from, to, radius = 1) {
          segment(mesh(lineGeometry, "frame"), from, to, radius);
        }

        const bodyMountDrop = 3.26;
        const armMountLift = 0;
        const lowerArmMount = {
          halfWidth: 44.4 / 2,
          height: -12,
          front: -15,
          rear: 21,
        };
        const widthControls = ["front", "rear"].map((end) => ({
          depth: lowerArmMount[end],
          input: document.getElementById(end + "LowerWidth"),
          readout: document.getElementById(end + "LowerWidthValue"),
          bar: mesh(lineGeometry, "frame"),
        }));
        function lowerArmPivots(sign, widths, heightOffsets = [0, 0]) {
          return widthControls.map(({ depth }, index) =>
            vector(
              (sign * widths[index]) / 2,
              lowerArmMount.height + heightOffsets[index],
              depth,
            ),
          );
        }
        fixedLine(vector(-28, 0, 0), vector(28, 0, 0), 3.1);
        fixedLine(vector(0, -21, -37), vector(0, -21, -73));
        fixedLine(vector(0, -21, -73), vector(5, -21, -65));
        fixedLine(vector(0, -21, -73), vector(-5, -21, -65));
        const tireRadius = 30;
        const tireWidth = 26;
        const tireHalfWidth = tireWidth / 2;
        const tireCenterOffset = tireHalfWidth + 3;
        const tireEdgeRadius =
          tireRadius - tireHalfWidth * Math.tan(MathUtils.degToRad(2));
        const toePivotBaseHeight = 6;
        const toePivotOutwardOffset = 3;
        const grid = new THREE.GridHelper(280, 14, 0xd5dfd9, 0xd5dfd9);
        scene.add(grid);

        function makeSide(sign, id) {
          const lowerArmDepth = document.getElementById(id + "LowerArmDepth");
          const lowerArmDepthValue = document.getElementById(
            id + "LowerArmDepthValue",
          );
          const mountHeightControls = ["Front", "Rear"].map((end) => {
            const controlId = id + end + "LowerHeight";
            return {
              input: document.getElementById(controlId),
              readout: document.getElementById(controlId + "Value"),
            };
          });
          const knuckleHeights = ["Lower", "Upper"].map((end) => {
            const controlId = id + "Knuckle" + end + "Height";
            return {
              input: document.getElementById(controlId),
              readout: document.getElementById(controlId + "Value"),
            };
          });
          const lowerArmLength = document.getElementById(id + "LowerArmLength");
          const lowerArmLengthValue = document.getElementById(
            id + "LowerArmLengthValue",
          );
          const upperArmLength = document.getElementById(id + "UpperArmLength");
          const upperArmLengthValue = document.getElementById(
            id + "UpperArmLengthValue",
          );
          const toeRodLength = document.getElementById(id + "ToeRodLength");
          const toeRodLengthValue = document.getElementById(
            id + "ToeRodLengthValue",
          );
          const toeHeight = document.getElementById(id + "ToeHeight");
          const toeHeightValue = document.getElementById(id + "ToeHeightValue");
          const toeEndHeightInput = document.getElementById(
            id + "ToeEndHeight",
          );
          const toeEndHeightValue = document.getElementById(
            id + "ToeEndHeightValue",
          );
          const toeEndProjectionInput = document.getElementById(
            id + "ToeEndProjection",
          );
          const toeEndProjectionValue = document.getElementById(
            id + "ToeEndProjectionValue",
          );
          const lowerPivot = vector(
            sign * lowerArmMount.halfWidth,
            lowerArmMount.height,
            0,
          );
          const lowerLength = Number(lowerArmLength.defaultValue);
          const upperLength = Number(upperArmLength.defaultValue);
          const lowerRest = vector(lowerPivot.x + sign * lowerLength, -15, 0);
          const upperPivot = vector(sign * 22.107, 16, 0);
          const uprightLength = 32;
          const geometry = {
            sign,
            lowerPivot,
            upperPivot,
            lowerRest,
            lowerLength,
            upperLength,
            uprightLength,
            lowerKnuckleHeight: 0,
            upperKnuckleHeight: 0,
          };
          const toeLength = Number(toeRodLength.defaultValue);
          const toePivot = vector(
            sign * (lowerArmMount.halfWidth + toePivotOutwardOffset),
            lowerPivot.y + toePivotBaseHeight - bodyMountDrop,
            lowerArmMount.front,
          );
          const input = document.getElementById(id);
          const readout = document.getElementById(id + "Value");
          const camberReadout = document.getElementById(id + "Camber");
          const toeReadout = document.getElementById(id + "Toe");
          const casterReadout = document.getElementById(id + "Caster");
          const lower = Array.from({ length: 3 }, () =>
            mesh(lineGeometry, "lower"),
          );
          const upper = Array.from({ length: 3 }, () =>
            mesh(lineGeometry, "upper"),
          );
          const toe = mesh(lineGeometry, "toe");
          const upperMount = mesh(lineGeometry, "hub");
          const lowerMount = mesh(lineGeometry, "hub");
          const shaft = mesh(lineGeometry, "frame");
          const stub = mesh(lineGeometry, "hub");
          const knuckle = new THREE.Group();
          const toeMount = new THREE.Mesh(lineGeometry, materials.hub);
          const toeMountBent = new THREE.Mesh(lineGeometry, materials.hub);
          const toeEndSpacer = new THREE.Mesh(lineGeometry, materials.hub);
          knuckle.add(
            new THREE.Mesh(barrelGeometry, barrelMaterial),
            toeMount,
            toeMountBent,
            toeEndSpacer,
          );
          scene.add(knuckle);
          const joints = [
            "lower",
            "lower",
            "lower",
            "upper",
            "upper",
            "upper",
            "toe",
            "toe",
          ].map((part) => mesh(jointGeometry, part));
          return {
            ...geometry,
            lowerPivot: lowerPivot.setY(lowerPivot.y - bodyMountDrop),
            upperPivot: upperPivot
              .setY(upperPivot.y - bodyMountDrop + armMountLift)
              .setZ(4),
            mountHeightControls,
            knuckleHeights,
            toePivot,
            toeLength,
            lowerArmLength,
            lowerArmLengthValue,
            lowerArmDepth,
            lowerArmDepthValue,
            upperArmLength,
            upperArmLengthValue,
            toeRodLength,
            toeRodLengthValue,
            toeHeight,
            toeHeightValue,
            toeEndHeightInput,
            toeEndHeightValue,
            toeEndProjectionInput,
            toeEndProjectionValue,
            toeMount,
            toeMountBent,
            toeEndSpacer,
            input,
            readout,
            camberReadout,
            toeReadout,
            casterReadout,
            lower,
            upper,
            toe,
            upperMount,
            lowerMount,
            shaft,
            stub,
            knuckle,
            joints,
          };
        }

        function solveUpright(side, travel, [frontLow, rearLow]) {
          const {
            sign,
            upperPivot,
            lowerRest,
            lowerLength,
            lowerArmDepthOffset = 0,
            upperLength,
            uprightLength,
            lowerKnuckleHeight,
            upperKnuckleHeight,
          } = side;
          const hinge = rearLow.clone().sub(frontLow);
          const hingeCenter = frontLow
            .clone()
            .addScaledVector(
              hinge,
              (lowerArmDepthOffset - frontLow.z) / hinge.z,
            );
          hinge.normalize();
          const lateral = vector(hinge.z, 0, -hinge.x).normalize();
          const vertical = hinge.clone().cross(lateral);
          const jointSpacing =
            uprightLength + upperKnuckleHeight + lowerKnuckleHeight;
          function jointGeometryAt(stroke) {
            const rise = (lowerRest.y + stroke - hingeCenter.y) / vertical.y;
            const low = hingeCenter
              .clone()
              .addScaledVector(
                lateral,
                sign * Math.sqrt(lowerLength ** 2 - rise ** 2),
              )
              .addScaledVector(vertical, rise);
            const diagonal = low.clone().sub(upperPivot);
            const uprightRadiusSquared = jointSpacing ** 2 - diagonal.z ** 2;
            const distance = diagonal.setZ(0).length();
            const along =
              (upperLength ** 2 - uprightRadiusSquared + distance ** 2) /
              (2 * distance);
            return {
              low,
              diagonal: diagonal.divideScalar(distance),
              along,
              heightSquared: upperLength ** 2 - along ** 2,
            };
          }
          let joints = jointGeometryAt(travel);
          const strokeLimited = !(joints.heightSquared >= 0);
          if (strokeLimited) {
            let feasible = 0;
            let infeasible = 1;
            joints = jointGeometryAt(0);
            for (let iteration = 0; iteration < 24; iteration++) {
              const fraction = (feasible + infeasible) / 2;
              const candidate = jointGeometryAt(travel * fraction);
              if (candidate.heightSquared >= 0) {
                joints = candidate;
                feasible = fraction;
              } else {
                infeasible = fraction;
              }
            }
          }
          const { low, diagonal, along, heightSquared } = joints;
          const height = Math.sqrt(heightSquared);
          const perpendicular = up
            .clone()
            .addScaledVector(diagonal, -up.dot(diagonal))
            .normalize();
          const high = upperPivot
            .clone()
            .addScaledVector(diagonal, along)
            .addScaledVector(perpendicular, height);
          const axis = high.clone().sub(low).normalize();
          const rearDirection = rear
            .clone()
            .addScaledVector(axis, -rear.dot(axis))
            .normalize();
          const outside = axis
            .clone()
            .cross(rearDirection)
            .multiplyScalar(sign);
          const hub = low
            .clone()
            .addScaledVector(axis, uprightLength / 2 + lowerKnuckleHeight);
          return {
            low,
            high,
            hub,
            axis,
            outside,
            rearDirection,
            strokeLimited,
          };
        }

        function toeMountTipOffset(length) {
          const bentLength = length - toeMountStraightLength;
          return vector(
            toeMountStraightLength + bentLength * Math.cos(toeMountBendAngle),
            -bentLength * Math.sin(toeMountBendAngle),
            0,
          );
        }

        function toeJoint(hub, outside, rearDirection, rotation, radius) {
          return hub
            .clone()
            .addScaledVector(rearDirection, -radius * Math.cos(rotation))
            .addScaledVector(outside, radius * Math.sin(rotation));
        }

        function solve(side, travel, pivots) {
          const { toePivot, toeLength, toeEndHeight } = side;
          const {
            low,
            high,
            hub,
            axis,
            outside,
            rearDirection,
            strokeLimited,
          } = solveUpright(side, travel, pivots);
          const ballOrbitCenter = hub
            .clone()
            .addScaledVector(axis, toeEndHeight);
          const toPivot = toePivot.clone().sub(ballOrbitCenter);
          const localMountTip = toeMountTipOffset(side.toeEndMountLength);
          const radius = localMountTip.length();
          const forwardComponent = -toPivot.dot(rearDirection);
          const outwardComponent = toPivot.dot(outside);
          const target =
            (toPivot.lengthSq() + radius ** 2 - toeLength ** 2) / (2 * radius);
          const phase = Math.atan2(outwardComponent, forwardComponent);
          const ratio = target / Math.hypot(forwardComponent, outwardComponent);
          const reachable = Math.abs(ratio) <= 1 + 1e-10;
          const tipAngle = phase + Math.acos(MathUtils.clamp(ratio, -1, 1));
          const rotation =
            tipAngle - Math.atan2(localMountTip.y, localMountTip.x);
          const toeMountTip = toeJoint(
            hub,
            outside,
            rearDirection,
            tipAngle,
            radius,
          );
          const toeEnd = toeMountTip
            .clone()
            .addScaledVector(axis, toeEndHeight);
          const axle = outside
            .multiplyScalar(Math.cos(rotation))
            .addScaledVector(rearDirection, Math.sin(rotation));
          const mountDirection = axis
            .clone()
            .cross(axle)
            .multiplyScalar(side.sign);
          return {
            low,
            high,
            hub,
            mountDirection,
            localMountTip,
            toeEnd,
            axle,
            reachable,
            strokeLimited,
          };
        }

        function formatAngle(radians) {
          const rounded = Math.round(MathUtils.radToDeg(radians) * 100) / 100;
          return `${rounded > 0 ? "+" : ""}${rounded.toFixed(2)}\u00b0`;
        }

        function armStem(front, rearMount) {
          return front.clone().lerp(rearMount, 0.45);
        }

        function drawArm(
          parts,
          front,
          rearMount,
          outerJoint,
          stem = armStem(front, rearMount),
        ) {
          const tip = stem.clone().lerp(outerJoint, 0.62);
          segment(parts[0], front, rearMount, 2.7);
          segment(parts[1], stem, tip, 3.3);
          segment(parts[2], tip, outerJoint, 1.5);
        }

        function drawSide(side, rideHeightOffset, pivots, mounts) {
          const {
            low,
            high,
            hub,
            mountDirection,
            localMountTip,
            toeEnd,
            axle,
            reachable,
            strokeLimited,
          } = solve(side, -rideHeightOffset, pivots);
          const camber = Math.atan2(-axle.y, Math.hypot(axle.x, axle.z));
          const toeAngle = Math.atan2(-axle.z, side.sign * axle.x);
          let displayAxle = axle;
          if (emphasis.checked) {
            const displayCamber = 3 * camber;
            const displayToe = 3 * toeAngle;
            const horizontal = Math.cos(displayCamber);
            displayAxle = vector(
              side.sign * horizontal * Math.cos(displayToe),
              -Math.sin(displayCamber),
              -horizontal * Math.sin(displayToe),
            );
            mountDirection.applyQuaternion(
              new THREE.Quaternion().setFromUnitVectors(axle, displayAxle),
            );
          }
          knuckleBasis.makeBasis(
            mountDirection,
            displayAxle,
            mountDirection.clone().cross(displayAxle),
          );
          side.knuckle.position.copy(hub);
          side.knuckle.quaternion.setFromRotationMatrix(knuckleBasis);
          const localBend = vector(toeMountStraightLength, 0, 0);
          segment(side.toeMount, vector(0, 0, 0), localBend, 2.8);
          segment(side.toeMountBent, localBend, localMountTip, 2.8);
          const localBall = localMountTip.clone();
          if (emphasis.checked) {
            localBall.z -= side.sign * side.toeEndHeight;
          } else {
            side.knuckle.worldToLocal(localBall.copy(toeEnd));
          }
          side.toeEndSpacer.visible = side.toeEndHeight !== 0;
          if (side.toeEndSpacer.visible)
            segment(side.toeEndSpacer, localMountTip, localBall, 1.7);
          const displayToeEnd = emphasis.checked
            ? side.knuckle.localToWorld(localBall)
            : toeEnd;
          const [frontLow, rearLow] = mounts;
          const frontHigh = side.upperPivot.clone().addScaledVector(rear, -9);
          const rearHigh = side.upperPivot.clone().addScaledVector(rear, 11);
          drawArm(side.lower, frontLow, rearLow, low, armStem(...pivots));
          drawArm(side.upper, frontHigh, rearHigh, high);
          segment(side.toe, side.toePivot, displayToeEnd, 1.5);
          side.toe.visible = reachable;
          const uprightAxis = high.clone().sub(low).normalize();
          const mountBaseDistance = side.uprightLength * 0.27;
          segment(
            side.upperMount,
            hub.clone().addScaledVector(uprightAxis, mountBaseDistance),
            high,
            3.3,
          );
          segment(
            side.lowerMount,
            low,
            hub.clone().addScaledVector(uprightAxis, -mountBaseDistance),
            3.3,
          );
          segment(side.shaft, vector(side.sign * 28, 0, 0), hub, 1.2);
          segment(
            side.stub,
            hub,
            hub.clone().addScaledVector(displayAxle, 7.5),
            1.7,
          );
          [
            frontLow,
            rearLow,
            low,
            frontHigh,
            rearHigh,
            high,
            side.toePivot,
            displayToeEnd,
          ].forEach((position, index) => {
            side.joints[index].position.copy(position);
            side.joints[index].scale.setScalar(2.5);
          });
          const rideHeight = `${(8 + rideHeightOffset).toFixed(1)} mm`;
          side.readout.value = rideHeight;
          side.input.setAttribute("aria-valuetext", rideHeight);
          side.camberReadout.value = reachable ? formatAngle(camber) : "--";
          side.toeReadout.value = reachable ? formatAngle(-toeAngle) : "--";
          side.casterReadout.value = formatAngle(
            Math.atan2(uprightAxis.z, uprightAxis.y),
          );
          return {
            low,
            high,
            hub,
            axle,
            displayAxle,
            reachable,
            strokeLimited,
          };
        }

        function projectedArmDirection(outer, front, back) {
          const hinge = back.clone().sub(front).normalize();
          const radial = outer.clone().sub(front);
          radial.addScaledVector(hinge, -radial.dot(hinge));
          return new THREE.Vector2(radial.x, radial.y).normalize();
        }

        function intersectGuides(
          origin,
          direction,
          otherOrigin,
          otherDirection,
        ) {
          const determinant = direction.cross(otherDirection);
          if (Math.abs(determinant) < 1e-9) return null;
          const distance =
            otherOrigin.clone().sub(origin).cross(otherDirection) / determinant;
          return origin.clone().addScaledVector(direction, distance);
        }

        function makeRollCenterDiagram() {
          const group = new THREE.Group();
          scene.add(group);
          const armMaterial = new THREE.LineDashedMaterial({
            color: 0x657b79,
            dashSize: 3,
            gapSize: 2,
          });
          const contactMaterial = new THREE.LineDashedMaterial({
            color: 0x80538a,
            dashSize: 4,
            gapSize: 2,
          });
          const pointMaterial = new THREE.MeshBasicMaterial({
            color: 0x80538a,
          });
          const centerMaterial = new THREE.MeshBasicMaterial({
            color: 0xc12050,
            depthTest: false,
          });
          function line(material) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute(
              "position",
              new THREE.BufferAttribute(new Float32Array(6), 3),
            );
            const object = new THREE.Line(geometry, material);
            object.frustumCulled = false;
            group.add(object);
            return object;
          }
          function point(material, radius) {
            const object = new THREE.Mesh(jointGeometry, material);
            object.scale.setScalar(radius);
            group.add(object);
            return object;
          }
          const corners = Array.from({ length: 2 }, () => ({
            lower: line(armMaterial),
            upper: line(armMaterial),
            swing: line(contactMaterial),
            contact: point(pointMaterial, 2),
            instant: point(pointMaterial, 2.5),
          }));
          const center = point(centerMaterial, 3.2);
          center.renderOrder = 1;
          const tireGeometry = new THREE.LatheGeometry(
            [
              new THREE.Vector2(0, -tireHalfWidth),
              new THREE.Vector2(tireEdgeRadius, -tireHalfWidth),
              new THREE.Vector2(tireRadius, 0),
              new THREE.Vector2(tireEdgeRadius, tireHalfWidth),
              new THREE.Vector2(0, tireHalfWidth),
            ],
            48,
          );
          const tireMaterial = new THREE.MeshLambertMaterial({
            color: 0x46545b,
            transparent: true,
            depthWrite: false,
          });
          const tireOutlineMaterial = new THREE.LineBasicMaterial({
            color: 0x46545b,
            transparent: true,
            opacity: 0.05,
            depthWrite: false,
          });
          const tireSegments = tireGeometry.parameters.segments;
          const tireOutlineGeometry = new THREE.BufferGeometry().setFromPoints(
            Array.from({ length: tireSegments }, (_, index) => {
              const angle = (index / tireSegments) * 2 * Math.PI;
              return vector(
                tireEdgeRadius * Math.sin(angle),
                0,
                tireEdgeRadius * Math.cos(angle),
              );
            }),
          );
          const tires = corners.map(() => {
            const tire = new THREE.Mesh(tireGeometry, tireMaterial);
            for (const edge of [-tireHalfWidth, tireHalfWidth]) {
              const outline = new THREE.LineLoop(
                tireOutlineGeometry,
                tireOutlineMaterial,
              );
              outline.position.y = edge;
              tire.add(outline);
            }
            scene.add(tire);
            return tire;
          });
          const readout = document.getElementById("rollCenterHeight");

          function drawLine(object, from, to) {
            const delta = to.clone().sub(from).clampLength(0, 1000);
            const positions = object.geometry.attributes.position;
            positions.setXYZ(0, from.x, from.y, 0);
            positions.setXYZ(1, from.x + delta.x, from.y + delta.y, 0);
            positions.needsUpdate = true;
            object.computeLineDistances();
          }

          return function drawRollCenter(poses, roadDirection, visible) {
            group.visible = showRollCenter.checked && visible;
            readout.parentElement.hidden = !showRollCenter.checked;
            tireMaterial.opacity = showRollCenter.checked ? 0.22 : 0.19;
            poses.forEach(({ hub, displayAxle }, index) => {
              tires[index].position
                .copy(hub)
                .addScaledVector(displayAxle, tireCenterOffset);
              tires[index].quaternion.setFromUnitVectors(up, displayAxle);
            });
            if (!showRollCenter.checked) return 0;
            let extent = 0;
            const swingLines = poses.map(
              ({ low, high, contact, pivots, upperPivot }, index) => {
                const lower = new THREE.Vector2(low.x, low.y);
                const upper = new THREE.Vector2(high.x, high.y);
                const lowerDirection = projectedArmDirection(low, ...pivots);
                const upperDirection = projectedArmDirection(
                  high,
                  upperPivot,
                  upperPivot.clone().add(rear),
                );
                const instant = intersectGuides(
                  lower,
                  lowerDirection,
                  upper,
                  upperDirection,
                );
                const guide = corners[index];
                const swingDirection = instant
                  ? instant.clone().sub(contact).normalize()
                  : lowerDirection;
                const extend = (origin, direction) =>
                  origin.clone().addScaledVector(direction, -1000);
                drawLine(
                  guide.lower,
                  lower,
                  instant ?? extend(lower, lowerDirection),
                );
                drawLine(
                  guide.upper,
                  upper,
                  instant ?? extend(upper, upperDirection),
                );
                guide.contact.position.set(contact.x, contact.y, 0);
                guide.instant.visible = instant !== null;
                if (instant) {
                  guide.instant.position.set(instant.x, instant.y, 0);
                  extent = Math.max(extent, Math.abs(instant.x));
                }
                return { contact, instant, swingDirection, guide };
              },
            );
            const [left, right] = swingLines;
            const rollCenter = intersectGuides(
              left.contact,
              left.swingDirection,
              right.contact,
              right.swingDirection,
            );
            center.visible = rollCenter !== null;
            if (rollCenter) {
              center.position.set(rollCenter.x, rollCenter.y, 0);
            }
            for (const {
              contact,
              instant,
              swingDirection,
              guide,
            } of swingLines) {
              const instantDistance = instant
                ? instant.distanceTo(contact)
                : -1000;
              const centerDistance = rollCenter
                ? rollCenter.clone().sub(contact).dot(swingDirection)
                : 0;
              const start = Math.max(
                -500,
                Math.min(0, instantDistance, centerDistance),
              );
              const end = Math.min(
                500,
                Math.max(0, instantDistance, centerDistance),
              );
              drawLine(
                guide.swing,
                contact.clone().addScaledVector(swingDirection, start),
                contact.clone().addScaledVector(swingDirection, end),
              );
            }
            readout.value = rollCenter
              ? `${roadDirection.cross(rollCenter.clone().sub(left.contact)).toFixed(1)} mm`
              : "--";
            return Math.min(extent, 220);
          };
        }

        const sides = [makeSide(-1, "left"), makeSide(1, "right")];
        const showRollCenter = document.getElementById("showRollCenter");
        const drawRollCenter = makeRollCenterDiagram();
        const views = {
          oblique: [0.56, 0.58],
          top: [0, Math.PI / 2],
          rear: [0, 0],
        };
        const viewButtons = [...document.querySelectorAll("[data-view]")];
        const animation = document.getElementById("animate");
        const emphasis = document.getElementById("emphasize");
        const strokeSync = document.getElementById("strokeSync");
        const defaultStrokeSync = strokeSync.getAttribute("aria-pressed");
        const isStrokeSynced = () =>
          strokeSync.getAttribute("aria-pressed") === "true";
        const poseWarning = document.getElementById("poseWarning");
        const bodyWidth = document.getElementById("bodyWidth");
        const bodyWidthDisplay = document.getElementById("bodyWidthDisplay");
        let [yaw, elevation] = views.oblique;
        let zoom = 1;
        const activePointers = new Map();
        let animationStart = null;
        let lastStrokeIndex = 0;

        function tireSupport(axial) {
          const radial = Math.sqrt(Math.max(0, 1 - axial * axial));
          const centerReach = tireRadius * radial;
          const edgeReach =
            tireHalfWidth * Math.abs(axial) + tireEdgeRadius * radial;
          return edgeReach > centerReach
            ? {
                offset: -Math.sign(axial) * tireHalfWidth,
                radius: tireEdgeRadius,
                reach: edgeReach,
              }
            : { offset: 0, radius: tireRadius, reach: centerReach };
        }

        function tireRoadNormal([left, right]) {
          const centerDelta = right.tireCenter.clone().sub(left.tireCenter);
          const normal = new THREE.Vector3();
          let lowAngle = -Math.PI / 2;
          let highAngle = Math.PI / 2;
          for (let iteration = 0; iteration < 32; iteration++) {
            const angle = (lowAngle + highAngle) / 2;
            normal.set(-Math.sin(angle), Math.cos(angle), 0);
            const gap =
              centerDelta.dot(normal) +
              tireSupport(left.axle.dot(normal)).reach -
              tireSupport(right.axle.dot(normal)).reach;
            if (Math.abs(gap) < 1e-8) break;
            if (gap > 0) lowAngle = angle;
            else highAngle = angle;
          }
          return normal;
        }

        function tireContact({ tireCenter, axle }, normal) {
          const axial = axle.dot(normal);
          const { offset, radius } = tireSupport(axial);
          const radial = normal
            .clone()
            .addScaledVector(axle, -axial)
            .normalize();
          const point = tireCenter
            .clone()
            .addScaledVector(axle, offset)
            .addScaledVector(radial, -radius);
          return new THREE.Vector2(point.x, point.y);
        }

        function render() {
          const width = canvas.clientWidth;
          const height = canvas.clientHeight;
          const aspect = width / Math.max(height, 1);
          const halfHeight = Math.max(72, 115 / aspect) / zoom;
          camera.left = -halfHeight * aspect;
          camera.right = halfHeight * aspect;
          camera.top = halfHeight;
          camera.bottom = -halfHeight;
          camera.position.copy(frameCenter);
          if (elevation === Math.PI / 2) {
            camera.position.y += 330;
            camera.up.set(0, 0, -1);
          } else {
            camera.position.add(
              vector(
                330 * Math.sin(yaw) * Math.cos(elevation),
                330 * Math.sin(elevation),
                330 * Math.cos(yaw) * Math.cos(elevation),
              ),
            );
            camera.up.copy(up);
          }
          camera.lookAt(frameCenter);
          camera.updateProjectionMatrix();
          const widths = widthControls.map(({ input, readout }) => {
            const width = Number(input.value);
            readout.value = `${width.toFixed(1)} mm`;
            return width;
          });
          const [leftPivots, rightPivots] = sides.map(
            ({ sign, mountHeightControls }) => {
              const heightOffsets = mountHeightControls.map(
                ({ input, readout }) => {
                  const offset = Number(input.value);
                  readout.value = `${offset.toFixed(1)} mm`;
                  return offset - bodyMountDrop + armMountLift;
                },
              );
              return lowerArmPivots(sign, widths, heightOffsets);
            },
          );
          widthControls.forEach(({ bar }, index) => {
            segment(bar, leftPivots[index], rightPivots[index], 2.1);
          });
          const poses = sides.map((side) => {
            [side.lowerKnuckleHeight, side.upperKnuckleHeight] =
              side.knuckleHeights.map(({ input, readout }) => {
                const offset = Number(input.value);
                readout.value = `${offset.toFixed(1)} mm`;
                return offset;
              });
            side.toeLength = Number(side.toeRodLength.value);
            side.toeRodLengthValue.value = `${side.toeLength.toFixed(3)} mm`;
            side.lowerLength = Number(side.lowerArmLength.value);
            side.upperLength = Number(side.upperArmLength.value);
            side.lowerArmLengthValue.value = `${side.lowerLength.toFixed(1)} mm`;
            side.upperArmLengthValue.value = `${side.upperLength.toFixed(1)} mm`;
            const heightOffset = Number(side.toeHeight.value);
            side.toeHeightValue.value = `${Number(heightOffset.toFixed(2))} mm`;
            side.toePivot.y =
              side.lowerPivot.y + (toePivotBaseHeight + heightOffset);
            const toeEndHeight = Number(side.toeEndHeightInput.value);
            side.toeEndHeight = toeEndHeight + 1;
            side.toeEndHeightValue.value = `${toeEndHeight.toFixed(1)} mm`;
            const projection = Number(side.toeEndProjectionInput.value);
            side.toeEndProjectionValue.value = `${projection.toFixed(1)} mm`;
            side.toeEndMountLength = toeEndBaseLength + projection;
            const lowerArmDepth = Number(side.lowerArmDepth.value);
            side.lowerArmDepthOffset = lowerArmDepth + 4;
            side.lowerArmDepthValue.value = `${lowerArmDepth.toFixed(1)} mm`;
            const mounts = side.sign < 0 ? leftPivots : rightPivots;
            const hinge = mounts[1].clone().sub(mounts[0]);
            const pivots = mounts.map((mount) =>
              mount
                .clone()
                .addScaledVector(hinge, side.lowerArmDepthOffset / hinge.z),
            );
            const pose = drawSide(
              side,
              Number(side.input.value),
              pivots,
              mounts,
            );
            const tireCenter = pose.hub
              .clone()
              .addScaledVector(pose.axle, tireCenterOffset);
            return {
              ...pose,
              tireCenter,
              pivots,
              upperPivot: side.upperPivot,
            };
          });
          const roadNormal = tireRoadNormal(poses);
          poses.forEach((pose) => {
            pose.contact = tireContact(pose, roadNormal);
          });
          const [leftContact, rightContact] = poses.map(
            ({ contact }) => contact,
          );
          const roadDirection = new THREE.Vector2(roadNormal.y, -roadNormal.x);
          grid.position.set(
            (leftContact.x + rightContact.x) / 2,
            (leftContact.y + rightContact.y) / 2,
            0,
          );
          grid.rotation.z = Math.atan2(roadDirection.y, roadDirection.x);
          const guideExtent = drawRollCenter(
            poses,
            roadDirection,
            elevation !== Math.PI / 2,
          );
          if (yaw === 0 && elevation === 0 && guideExtent > 0) {
            const framedHeight =
              Math.max(72, (guideExtent + 16) / aspect, 115 / aspect) / zoom;
            camera.left = -framedHeight * aspect;
            camera.right = framedHeight * aspect;
            camera.top = framedHeight;
            camera.bottom = -framedHeight;
            camera.updateProjectionMatrix();
          }
          const [left, right] = sides;
          const hubSpan = Math.abs(
            right.knuckle.position.x - left.knuckle.position.x,
          );
          bodyWidth.value = `${hubSpan.toFixed(1)} mm`;
          bodyWidthDisplay.hidden = false;
          const warnings = [];
          if (poses.some(({ strokeLimited }) => strokeLimited)) {
            warnings.push("アームが届く範囲までストロークを制限しています");
          }
          if (poses.some(({ reachable }) => !reachable)) {
            warnings.push("この設定ではトーロッドが取付点に届きません");
          }
          poseWarning.textContent = warnings.join(" / ");
          poseWarning.hidden = warnings.length === 0;
          renderer.render(scene, camera);
        }

        function setAnimating(enabled) {
          animationStart = enabled ? performance.now() : null;
          animation.setAttribute("aria-pressed", enabled);
          animation.textContent = enabled ? "停止" : "自動バンプ";
          if (enabled) requestAnimationFrame(tick);
        }

        function tick(time) {
          if (animationStart === null) return;
          sides.forEach((side, index) => {
            const phase = isStrokeSynced() ? 0 : (index * Math.PI) / 2;
            const min = Number(side.input.min);
            const max = Number(side.input.max);
            const progress =
              (1 + Math.sin((time - animationStart) / 650 + phase)) / 2;
            side.input.value = min + (max - min) * progress;
          });
          render();
          requestAnimationFrame(tick);
        }

        animation.addEventListener("click", () =>
          setAnimating(animationStart === null),
        );
        const sliders = Array.from(
          document.querySelectorAll('input[type="range"][id]'),
        );
        const sliderStorageKey = "AArmSim.sliderValues";
        const sliderSaveStatus = document.getElementById("sliderSaveStatus");
        const adjustmentLinks = [];
        for (const row of document.querySelectorAll(".adjustment-control")) {
          const [left, right] = row.querySelectorAll('input[type="range"]');
          const isWidthPair =
            left?.id === "frontLowerWidth" && right?.id === "rearLowerWidth";
          const isSidePair =
            left?.id.startsWith("left") &&
            right?.id === `right${left.id.slice(4)}`;
          if (!isWidthPair && !isSidePair) continue;

          const button = strokeSync.cloneNode(true);
          button.removeAttribute("id");
          button.setAttribute("aria-pressed", "false");
          const label = isWidthPair
            ? "前幅と後幅を連結"
            : `左右の${left.labels[0].firstChild.textContent.trim().slice(1)}を連結`;
          button.setAttribute("aria-label", label);
          button.title = label;
          row.classList.add("linked-adjustment");
          row.insertBefore(button, row.children[1]);
          adjustmentLinks.push({ button, left, right });

          let lastInput = left;
          const isLinked = () => button.getAttribute("aria-pressed") === "true";
          const sync = () => {
            const other = lastInput === left ? right : left;
            other.value = lastInput.value;
          };
          row.addEventListener(
            "input",
            (event) => {
              if (event.target !== left && event.target !== right) return;
              lastInput = event.target;
              if (isLinked()) sync();
            },
            true,
          );
          button.addEventListener("click", () => {
            const linked = !isLinked();
            button.setAttribute("aria-pressed", String(linked));
            if (linked) {
              sync();
              render();
            }
          });
        }

        function loadSliders() {
          try {
            const values = JSON.parse(localStorage.getItem(sliderStorageKey));
            for (const input of sliders) {
              const value = values?.[input.id];
              if (Number.isFinite(value)) input.value = String(value);
            }
            for (const { button, left, right } of adjustmentLinks) {
              const hasSavedValue =
                Number.isFinite(values?.[left.id]) ||
                Number.isFinite(values?.[right.id]);
              const matchesDefaults =
                left.value === left.defaultValue &&
                right.value === right.defaultValue;
              if (
                hasSavedValue &&
                !matchesDefaults &&
                left.value !== right.value
              )
                button.setAttribute("aria-pressed", "false");
            }
          } catch {
            return;
          }
        }

        function saveSliders(showStatus = true) {
          try {
            const values = Object.fromEntries(
              sliders.map((input) => [input.id, Number(input.value)]),
            );
            localStorage.setItem(sliderStorageKey, JSON.stringify(values));
            if (showStatus) sliderSaveStatus.textContent = "保存しました";
          } catch {
            if (showStatus)
              sliderSaveStatus.textContent = "保存できませんでした";
          }
        }

        function resetSliders(restoreSaved) {
          setAnimating(false);
          for (const input of sliders) input.value = input.defaultValue;
          if (restoreSaved) {
            loadSliders();
          } else {
            strokeSync.setAttribute("aria-pressed", defaultStrokeSync);
            for (const { button } of adjustmentLinks)
              button.setAttribute("aria-pressed", "false");
          }
          sliderSaveStatus.textContent = "";
          render();
        }

        document
          .getElementById("resetSliders")
          .addEventListener("click", () => resetSliders(true));
        document
          .getElementById("saveSliders")
          .addEventListener("click", saveSliders);
        document
          .getElementById("initializeSliders")
          .addEventListener("click", () => {
            resetSliders(false);
            saveSliders(false);
          });
        emphasis.addEventListener("change", render);
        showRollCenter.addEventListener("change", render);
        strokeSync.addEventListener("click", () => {
          const synced = !isStrokeSynced();
          strokeSync.setAttribute("aria-pressed", String(synced));
          if (synced) {
            sides[1 - lastStrokeIndex].input.value =
              sides[lastStrokeIndex].input.value;
            render();
          }
        });
        widthControls.forEach(({ input }) =>
          input.addEventListener("input", render),
        );
        sides.forEach((side, index) => {
          side.mountHeightControls.forEach(({ input }) =>
            input.addEventListener("input", render),
          );
          side.knuckleHeights.forEach(({ input }) =>
            input.addEventListener("input", render),
          );
          side.lowerArmLength.addEventListener("input", render);
          side.lowerArmDepth.addEventListener("input", render);
          side.upperArmLength.addEventListener("input", render);
          side.toeRodLength.addEventListener("input", render);
          side.toeHeight.addEventListener("input", render);
          side.toeEndHeightInput.addEventListener("input", render);
          side.toeEndProjectionInput.addEventListener("input", render);
          side.input.addEventListener("input", () => {
            setAnimating(false);
            lastStrokeIndex = index;
            if (isStrokeSynced())
              sides[1 - index].input.value = side.input.value;
            render();
          });
        });
        viewButtons.forEach((button) =>
          button.addEventListener("click", () => {
            [yaw, elevation] = views[button.dataset.view];
            zoom = 1;
            viewButtons.forEach((view) =>
              view.setAttribute("aria-pressed", view === button),
            );
            render();
          }),
        );
        function scaleZoom(factor) {
          zoom = MathUtils.clamp(zoom * factor, 0.65, 2.2);
          render();
        }

        function pointerDistance(first, second) {
          return Math.hypot(
            first.clientX - second.clientX,
            first.clientY - second.clientY,
          );
        }

        canvas.addEventListener("pointerdown", (event) => {
          const first = activePointers.values().next().value;
          if (
            event.button !== 0 ||
            activePointers.size >= 2 ||
            (first &&
              (first.pointerType !== "touch" || event.pointerType !== "touch"))
          )
            return;
          activePointers.set(event.pointerId, event);
          canvas.setPointerCapture(event.pointerId);
        });
        canvas.addEventListener("pointermove", (event) => {
          const previous = activePointers.get(event.pointerId);
          if (!previous) return;
          activePointers.set(event.pointerId, event);
          if (activePointers.size === 2) {
            const other = [...activePointers.values()].find(
              (pointer) => pointer.pointerId !== event.pointerId,
            );
            const before = pointerDistance(previous, other);
            const after = pointerDistance(event, other);
            if (before > 0 && after > 0 && before !== after)
              scaleZoom(after / before);
            return;
          }
          const deltaX = event.clientX - previous.clientX;
          const deltaY = event.clientY - previous.clientY;
          if (!deltaX && !deltaY) return;
          yaw -= deltaX * 0.008;
          elevation = MathUtils.clamp(elevation + deltaY * 0.008, -1.35, 1.55);
          viewButtons.forEach((view) =>
            view.setAttribute("aria-pressed", "false"),
          );
          render();
        });
        for (const type of [
          "pointerup",
          "pointercancel",
          "lostpointercapture",
        ]) {
          canvas.addEventListener(type, (event) => {
            activePointers.delete(event.pointerId);
          });
        }
        canvas.addEventListener(
          "wheel",
          (event) => {
            event.preventDefault();
            scaleZoom(Math.exp(-event.deltaY * 0.001));
          },
          { passive: false },
        );

        function resize() {
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
          render();
        }

        loadSliders();
        resize();
        new ResizeObserver(resize).observe(canvas);
        status.hidden = true;
      }

      try {
        start();
      } catch (error) {
        status.textContent =
          typeof THREE === "undefined"
            ? "Three.jsを読み込めません。ネット接続を確認してください。"
            : "3D描画を開始できません。WebGLが有効なブラウザーで開いてください。";
        console.error(error);
      }
    </script>
  </body>
</html>
